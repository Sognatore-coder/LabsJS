name: JS Check

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Check JS syntax
        run: find . -name "*.js" -not -path "./node_modules/*" -exec node --check {} \;
