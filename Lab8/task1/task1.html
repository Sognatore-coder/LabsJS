<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Знакомство с животными</title>
    <style>
        body { font-family: Arial; text-align: center; margin-top: 50px; }
        button { margin: 10px; padding: 8px 16px; font-size: 16px; cursor: pointer; }
        .image-container {
            position: relative;
            min-height: 300px;
            background: #f5f5f5;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px auto;
            max-width: 400px;
        }
        img { 
            max-width: 100%;
            max-height: 300px;
            border-radius: 16px;
            opacity: 0;
            transition: opacity 0.3s ease;
            object-fit: contain;
        }
        img.loaded { opacity: 1; }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #ddd;
            border-top-color: #4CAF50;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            position: absolute;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .animal-buttons button { 
            background: #4CAF50; 
            color: white; 
            border: none; 
            margin: 5px; 
            padding: 10px 20px; 
            cursor: pointer; 
        }

        #fact { 
            max-width: 500px; 
            margin: 20px auto; 
            font-style: italic; 
            padding: 15px; 
            background: #f9f9f9; 
            border-radius: 8px; 
        }

        .error { color: red; }
    </style>
</head>
<body>
    <h1>Добро пожаловать, <span id="username">...</span>!</h1>
    <button id="newNameBtn">🔄 Не нравится имя</button>
    <button id="continueBtn">➡ Далее</button>

    <div id="animalSection" style="display: none;">
        <h2>Кто тебе интересен?</h2>
        <div class="animal-buttons">
            <button data-animal="dog">🐕 Собака</button>
            <button data-animal="cat">🐈 Кошка</button>
            <button data-animal="fox">🦊 Лиса</button>
        </div>
        <div id="animalContent"></div>
    </div>

    <script>
        let currentUserName = "";

        //
        async function translateToRussian(text) {
            if (!text || text === "undefined") return "Не удалось загрузить факт";
            try {
                const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=en|ru`;
                const response = await fetch(url);
                const data = await response.json();
                // Проверяем, есть ли перевод
                if (data.responseData && data.responseData.translatedText) {
                    let translated = data.responseData.translatedText;
                    return translated;
                }
                return text;
            } catch (error) {
                console.error("Ошибка перевода:", error);
                return text;
            }
        }

        // Получение имени
        async function fetchRandomName() {
            try {
                const response = await fetch('https://randomuser.me/api/?nat=ru');
                const data = await response.json();
                return data.results[0].name.first;
            } catch (error) {
                return "Гость";
            }
        }

        // API для изображений
        async function getDogImage() {
            const res = await fetch('https://dog.ceo/api/breeds/image/random');
            const data = await res.json();
            return data.message;
        }

        async function getCatImage() {
            const res = await fetch('https://api.thecatapi.com/v1/images/search?size=small');
            const data = await res.json();
            return data[0].url;
        }

        async function getFoxImage() {
            const res = await fetch('https://randomfox.ca/floof/');
            const data = await res.json();
            return data.image;
        }

        //
        async function getDogFact() {
            try {
                const res = await fetch('https://dogapi.dog/api/v2/facts?limit=1');
                const data = await res.json();
                if (data.data && data.data[0] && data.data[0].attributes.body) {
                    return data.data[0].attributes.body;
                }
                throw new Error("Нет данных");
                
            } catch (error) {
                // Резервные факты на случай ошибки API
                const fallbackFacts = [
                    "Собаки могут понимать до 250 слов и жестов.",
                    "Нос собаки так же уникален, как отпечаток пальца человека.",
                    "Собаки видят мир в сине-желтых тонах.",
                    "Хвост собаки показывает ее настроение."
                ];
                return fallbackFacts[Math.floor(Math.random() * fallbackFacts.length)];
            }
        }

        async function getCatFact() {
            try {
                const res = await fetch('https://catfact.ninja/fact');
                const data = await res.json();
                return data.fact;
            } catch (error) {
                const fallbackFacts = [
                    "Кошки спят около 16 часов в день.",
                    "Мурлыканье кошки имеет лечебные свойства.",
                    "У кошек более 100 различных звуков в арсенале.",
                    "Кошки не чувствуют сладкий вкус."
                ];
                return fallbackFacts[Math.floor(Math.random() * fallbackFacts.length)];
            }
        }

        async function getFoxFact() {
            try {
                const res = await fetch('https://foxfactapi.vercel.app/api/v1/facts?limit=1');
                const data = await res.json();
                if (data.facts && data.facts[0]) return data.facts[0];
                throw new Error("Нет данных");
            } catch (error) {
                const fallbackFacts = [
                    "Лисы — отличные родители и заботятся о своих детёнышах.",
                    "Лисы могут издавать около 40 различных звуков.",
                    "Лиса — символ хитрости во многих культурах.",
                    "Лисы хорошо плавают и даже ныряют за добычей."
                ];
                return fallbackFacts[Math.floor(Math.random() * fallbackFacts.length)];
            }
        }

        async function fetchAnimalData(animal) {
            try {
                let image = "", factEn = "";
                switch(animal) {
                    case 'dog':
                        image = await getDogImage();
                        factEn = await getDogFact();
                        break;
                    case 'cat':
                        image = await getCatImage();
                        factEn = await getCatFact();
                        break;
                    case 'fox':
                        image = await getFoxImage();
                        factEn = await getFoxFact();
                        break;
                }
                // Переводим факт на русский
                const factRu = await translateToRussian(factEn);
                return { fact: factRu, image };
            } catch (err) {
                return { fact: "Не удалось загрузить факт. Попробуйте позже.", image: "" };
            }
        }

        function displayAnimalContent(image, fact) {
            const container = document.getElementById("animalContent");
            container.innerHTML = `
                <div class="image-container">
                    <div class="spinner"></div>
                    <img src="${image}" alt="Животное" referrerpolicy="no-referrer" decoding="async" loading="lazy">
                </div>
                <p id="fact"><strong>🐾 Интересный факт:</strong> ${fact}</p>
            `;
            
            const img = container.querySelector('img');
            img.onload = () => {
                img.classList.add('loaded');
                container.querySelector('.spinner').style.display = 'none';
            };
        }

        async function updateUserName() {
            const name = await fetchRandomName();
            currentUserName = name;
            document.getElementById("username").textContent = name;
        }

        async function showAnimal(animal) {
            const container = document.getElementById("animalContent");
            container.innerHTML = "<p>⏳ Загружаем данные...</p>";
            const { fact, image } = await fetchAnimalData(animal);
            if (image) displayAnimalContent(image, fact);
            else container.innerHTML = `<p class="error">❌ ${fact}</p>`;
        }

        // Обработчики
        document.getElementById("newNameBtn").onclick = () => updateUserName();
        document.getElementById("continueBtn").onclick = () => {
            document.getElementById("animalSection").style.display = "block";
        };

        document.querySelector(".animal-buttons").addEventListener("click", (e) => {
            const animal = e.target.dataset.animal;
            if (animal) showAnimal(animal);
        });

        updateUserName();
    </script>
</body>
</html>
