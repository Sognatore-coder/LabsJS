<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Беседин Кирилл</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 50px;
        }
        form {
            width: 400px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
        }
        .month-row {
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
        }
        button {
            margin-top: 20px;
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #0056b3;
        }
        .result {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h2>Расчёт средней зарплаты за первое полугодие</h2>
    <form id="salaryForm">
        <div class="month-row">
            <label>Январь:</label>
            <input type="number" id="jan" value="300" step="100">
        </div>
        <div class="month-row">
            <label>Февраль:</label>
            <input type="number" id="feb" value="200" step="100">
        </div>
        <div class="month-row">
            <label>Март:</label>
            <input type="number" id="mar" value="500" step="100">
        </div>
        <div class="month-row">
            <label>Апрель:</label>
            <input type="number" id="apr" value="250" step="100">
        </div>
        <div class="month-row">
            <label>Май:</label>
            <input type="number" id="may" value="350" step="100">
        </div>
        <div class="month-row">
            <label>Июнь:</label>
            <input type="number" id="jun" value="500" step="100">
        </div>
        
        <button type="button" id="calcBtn">Вычислить</button>
        
        <div class="result">
            <label>Средняя зарплата:</label>
            <input type="text" id="average" readonly>
        </div>
    </form>

    <script>
        document.getElementById('calcBtn').addEventListener('click', () => {
            const jan = parseFloat(document.getElementById('jan').value) || 0;
            const feb = parseFloat(document.getElementById('feb').value) || 0;
            const mar = parseFloat(document.getElementById('mar').value) || 0;
            const apr = parseFloat(document.getElementById('apr').value) || 0;
            const may = parseFloat(document.getElementById('may').value) || 0;
            const jun = parseFloat(document.getElementById('jun').value) || 0;
            
            const sum = jan + feb + mar + apr + may + jun;
            const average = sum / 6;
            
            document.getElementById('average').value = average.toFixed(2);
        });
    </script>
</body>
</html>
