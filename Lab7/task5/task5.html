<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Изменение текста</title>
</head>
<body>
    <label>Введите текст: <input type="text" id="textInput"></label>

    <script>
        document.getElementById('textInput').addEventListener('change', function(){
            alert('Текст был изменен!!!')
        });
    </script>
</body>
</html>
