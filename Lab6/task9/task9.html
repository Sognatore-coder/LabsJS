<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="stylesheet" href="style.css">
    <title>Генерация карточек</title>
</head>
<body>
    <script>
         // 9a Создание разметки через createElement
    let body = document.body;
    body.innerHTML = '';
    
    let header = document.createElement('header');
    body.appendChild(header);
    
    let content = document.createElement('main');
    content.className = 'content';
    body.appendChild(content);
    
    let aside = document.createElement('aside');
    content.appendChild(aside);
    
    let section = document.createElement('section');
    content.appendChild(section);
    
    let headerD = document.createElement('div');
    headerD.className = 'header-d';
    headerD.textContent = 'Выберите лицо, которое нравится вам больше остальных:';
    section.appendChild(headerD);
    
    let display = document.createElement('div');
    display.className = 'display';
    section.appendChild(display);

    // 9c Функция случайного имени
    let names = ['Иван', 'Петр', 'Алексей', 'Дмитрий', 'Сергей', 'Анна', 'Мария', 'Екатерина', 'Ольга', 'Татьяна'];
    let surnames = ['Иванов', 'Петров', 'Сидоров', 'Смирнов', 'Кузнецов', 'Попов', 'Васильев', 'Федоров', 'Михайлов'];
    
    function randomName() {
        let name = names[Math.floor(Math.random() * names.length)];
        let surname = surnames[Math.floor(Math.random() * surnames.length)];
        return `${name} ${surname}`;
    }
    
    // 9b Добавление карточек 
    let cardCount = 0;
    let interval = setInterval(() => {
        if (cardCount >= 6) {
            clearInterval(interval);
            return;
        }
        cardCount++;
        
        let card = document.createElement('div');
        card.className = 'card';
        
        let img = document.createElement('img');
        img.src = `https://thispersondoesnotexist.com/?${cardCount}`;
        card.appendChild(img);
        
        let description = document.createElement('div');
        description.className = 'description';
        
        let p = document.createElement('p');
        p.textContent = randomName();
        description.appendChild(p);
        
        card.appendChild(description);
        display.appendChild(card);
    }, 2000);
    </script>
</body>
</html>
