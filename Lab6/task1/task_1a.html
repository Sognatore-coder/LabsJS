<!DOCTYPE html>
<html>
<head>
    <title>Sin</title>
</head>
<body>
    <script>
        let x = parseFloat(prompt("Введите значение x:"));
        if(!isNaN(x)){
            let res = Math.sin(x);
            alert(`sin(${x}) = ${res}`);
        } else {
            alert("Введено некорректное число");
        }
    </script>
</body>
</html>
