<!DOCTYPE html>
<html>
<head>
    <title>Матрица с диагоналями</title>
</head>
<body>
    <script>
        let n = parseInt(prompt("Введите порядок матрицы n:"));
        if (!isNaN(n) && n > 0) {
            let matrix = [];
            for (let i = 0; i < n; i++) {
                matrix[i] = [];
                for (let j = 0; j < n; j++) {
                    matrix[i][j] = Math.floor(Math.random() * 100);
                }
            }

            let diagValues = [];
            for (let i = 0; i < n; i++) {
                diagValues.push(matrix[i][i]);
                if (i !== n - 1 - i) {
                    diagValues.push(matrix[i][n - 1 - i]);
                }
            }
            let maxDiag = Math.max(...diagValues);
            let minDiag = Math.min(...diagValues);

            // Обнуление, кроме мин/макс
            for (let i = 0; i < n; i++) {
                for (let j = 0; j < n; j++) {
                    if (i === j || i + j === n - 1) {
                        if (matrix[i][j] !== maxDiag && matrix[i][j] !== minDiag) {
                            matrix[i][j] = 0;
                        }
                    }
                }
            }

            let output = "Матрица:\n";
            for (let i = 0; i < n; i++) {
                output += matrix[i].join(" ") + "\n";
            }
            alert(output);
        }
    </script>
</body>
</html>
